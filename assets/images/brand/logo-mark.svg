<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"
     role="img" aria-label="TECHBISS">
  <title>TECHBISS</title>
  <defs>
    <linearGradient id="tbTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#C8FF4D"/>
      <stop offset="0.55" stop-color="#77EC8B"/>
      <stop offset="1"   stop-color="#26D9C9"/>
    </linearGradient>
    <clipPath id="tbClip">
      <rect width="100" height="100" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <rect width="100" height="100" rx="24" ry="24" fill="url(#tbTile)"/>

  <!-- Orbit rings: the transformation motif from the hero, at low contrast so
       they disappear cleanly at favicon sizes instead of muddying the glyph. -->
  <g clip-path="url(#tbClip)" fill="none" stroke="#fff">
    <circle cx="50" cy="50" r="43" stroke-opacity="0.15" stroke-width="1.6"/>
    <circle cx="50" cy="50" r="49.5" stroke-opacity="0.11" stroke-width="1.6"/>
  </g>

  <!-- The T, on a strict grid: crossbar 52 wide, stem 13.5 wide, glyph 46 tall
       and optically centred. -->
  <g fill="#fff">
    <rect x="22" y="26" width="56" height="14" rx="2"/>
    <rect x="43" y="38" width="14" height="36" rx="2"/>
  </g>
</svg>
