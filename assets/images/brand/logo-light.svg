<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 100" width="372" height="100"
     role="img" aria-label="TECHBISS">
  <title>TECHBISS</title>
  <!-- Fixed ink colour for light backgrounds and for contexts that ignore currentColor, such as email. -->
  <defs>
    <linearGradient id="lTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8FF4D"/><stop offset="0.55" stop-color="#77EC8B"/>
      <stop offset="1" stop-color="#26D9C9"/>
    </linearGradient>
    <clipPath id="lClip"><rect width="100" height="100" rx="24" ry="24"/></clipPath>
  </defs>

  <rect width="100" height="100" rx="24" ry="24" fill="url(#lTile)"/>
  <g clip-path="url(#lClip)" fill="none" stroke="#fff">
    <circle cx="50" cy="50" r="43" stroke-opacity="0.15" stroke-width="1.6"/>
    <circle cx="50" cy="50" r="49.5" stroke-opacity="0.11" stroke-width="1.6"/>
  </g>
  <g fill="#fff">
    <rect x="22" y="26" width="56" height="14" rx="2"/>
    <rect x="43" y="38" width="14" height="36" rx="2"/>
  </g>

  <!-- Wordmark inherits colour, so this one file works on any dark surface and
       follows a theme switch without needing a second asset. -->
  <text x="128" y="50" fill="#0D1220" dominant-baseline="central"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="40" font-weight="650" letter-spacing="5.6">TECHBISS</text>
</svg>
