<title>TECHBISS — Monolith</title>
<meta name="description" content="Monolith: a Swiss-editorial, brutalist-premium design concept for TECHBISS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#f5f5f2;
  --fg:#0b0b0c;
  --bg-inv:#0b0b0c;
  --fg-inv:#f5f5f2;
  --line: rgba(11,11,12,0.16);
  --line-strong: rgba(11,11,12,0.55);
  --muted: rgba(11,11,12,0.58);
  --surface: #f5f5f2;
  --surface-2: rgba(11,11,12,0.035);
  --accent:#1d3ef5;
  --accent-fg:#f5f5f2;
  --focus:#1d3ef5;
  --good:#0f7a3d;
  --warn:#a6650a;
  --bad:#c2291b;
  --rail-w: 232px;
  --rail-w-collapsed: 64px;
  --ff-display: 'Space Grotesk','Archivo','Helvetica Neue',Arial,sans-serif;
  --ff-mono: 'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0c; --fg:#f5f5f2; --bg-inv:#f5f5f2; --fg-inv:#0b0b0c;
    --line: rgba(245,245,242,0.16); --line-strong: rgba(245,245,242,0.55);
    --muted: rgba(245,245,242,0.58);
    --surface:#0b0b0c; --surface-2: rgba(245,245,242,0.045);
    --accent:#5c78ff; --accent-fg:#0b0b0c; --focus:#5c78ff;
    --good:#3fcf7f; --warn:#e0a334; --bad:#ff6a57;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --fg:#f5f5f2; --bg-inv:#f5f5f2; --fg-inv:#0b0b0c;
  --line: rgba(245,245,242,0.16); --line-strong: rgba(245,245,242,0.55);
  --muted: rgba(245,245,242,0.58);
  --surface:#0b0b0c; --surface-2: rgba(245,245,242,0.045);
  --accent:#5c78ff; --accent-fg:#0b0b0c; --focus:#5c78ff;
  --good:#3fcf7f; --warn:#e0a334; --bad:#ff6a57;
}

/* ============================= RESET / BASE ============================= */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }
@media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } }
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family: var(--ff-display);
  font-size: 15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,p,figure{ margin:0; }
a{ color:inherit; }
button{ font-family:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input,textarea,select{ font-family:inherit; color:inherit; background:none; }
ul{ list-style:none; margin:0; padding:0; }
:focus-visible{ outline:2px solid var(--focus); outline-offset:3px; }
.mono{ font-family: var(--ff-mono); }
.hidden{ display:none !important; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

/* ============================= LAYOUT SHELL ============================= */
#shell{ position:relative; min-height:100vh; }
#app{
  margin-left: var(--rail-w-collapsed);
  min-height:100vh;
  position:relative;
}
@media (min-width: 900px){
  #app{ margin-left: var(--rail-w); }
}
.wrap{
  max-width: 1720px;
  padding: 0 clamp(20px, 4vw, 64px);
  margin: 0 auto;
}
.grid12{
  display:grid;
  grid-template-columns: repeat(12, 1fr);
  gap: clamp(12px, 2vw, 32px);
}
.hr{ border:0; border-top:1px solid var(--line); margin:0; }
.hr-strong{ border:0; border-top:1px solid var(--line-strong); margin:0; }

/* ============================= NAV RAIL ============================= */
#rail{
  position:fixed; top:0; left:0; bottom:0;
  width: var(--rail-w-collapsed);
  border-right:1px solid var(--line);
  background: var(--bg);
  z-index: 60;
  display:flex; flex-direction:column; align-items:center;
  padding: 18px 0 16px;
}
@media (min-width:900px){
  #rail{ width: var(--rail-w); align-items:stretch; padding: 22px 0 18px; }
}
.rail-mark{
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line-strong); border-radius:2px; flex-shrink:0;
}
@media (min-width:900px){ .rail-mark{ margin-left:24px; } }
.rail-mark svg{ width:18px; height:18px; display:block; }

.rail-wordmark{
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-family: var(--ff-mono);
  font-size:11px; letter-spacing:.22em; font-weight:500;
  color: var(--muted);
  margin: 22px 0;
  user-select:none;
}
@media (min-width:900px){
  .rail-wordmark{ display:none; }
}
.rail-wordmark-h{
  display:none;
  font-family: var(--ff-mono); font-size:11px; letter-spacing:.24em; font-weight:500;
  color: var(--muted); margin: 20px 0 20px 24px;
}
@media (min-width:900px){ .rail-wordmark-h{ display:block; } }

.rail-index{ display:none; flex:1; overflow-y:auto; }
@media (min-width:900px){ .rail-index{ display:block; } }
.rail-index li{ border-top:1px solid var(--line); }
.rail-index li:last-child{ border-bottom:1px solid var(--line); }
.rail-index a{
  display:flex; align-items:baseline; gap:10px;
  padding:9px 10px 9px 24px; text-decoration:none;
  font-family:var(--ff-mono); font-size:11.5px; letter-spacing:.06em; color: var(--muted);
  position:relative;
}
.rail-index a .n{ color: var(--muted); font-variant-numeric: tabular-nums; }
.rail-index a:hover{ color:var(--fg); }
.rail-index a[aria-current="page"]{ color:var(--fg); font-weight:600; }
.rail-index a[aria-current="page"]::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent);
}
.rail-index .rail-sep{ margin-top:8px; padding-top:8px; }

.rail-bottom{ display:flex; flex-direction:column; align-items:center; gap:14px; margin-top:auto; }
@media (min-width:900px){ .rail-bottom{ align-items:stretch; padding: 0 10px 0 24px; gap:6px; } }
.rail-util{ display:none; }
@media (min-width:900px){
  .rail-util{ display:block; padding-top:10px; border-top:1px solid var(--line); }
  .rail-util a{ display:block; font-family:var(--ff-mono); font-size:10.5px; letter-spacing:.08em; color:var(--muted); text-decoration:none; padding:5px 0; }
  .rail-util a:hover{ color:var(--fg); }
}

.rail-trigger{
  width:36px; height:36px; border:1px solid var(--line-strong); border-radius:2px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
@media (min-width:900px){ .rail-trigger{ display:none; } }
.rail-trigger svg{ width:16px; height:16px; }

.theme-toggle{
  width:36px; height:36px; border:1px solid var(--line-strong); border-radius:2px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; overflow:hidden;
}
@media (min-width:900px){ .theme-toggle{ width:auto; height:auto; border:0; justify-content:flex-start; } }
.theme-toggle svg{ width:16px; height:16px; }
.theme-toggle .tt-label{ display:none; }
@media (min-width:900px){
  .theme-toggle{ display:flex; align-items:center; gap:8px; font-family:var(--ff-mono); font-size:10.5px; letter-spacing:.08em; color:var(--muted); padding:6px 0; }
  .theme-toggle:hover{ color:var(--fg); }
  .theme-toggle .tt-label{ display:inline; }
}
.tt-wipe{ position:absolute; inset:0; background:var(--fg); transform:translateY(101%); }
.tt-wipe.run{ animation: ttwipe .5s ease forwards; }
@keyframes ttwipe{ 0%{transform:translateY(101%);} 45%{transform:translateY(0);} 100%{transform:translateY(-101%);} }

/* full-screen mobile index overlay */
#index-overlay{
  position:fixed; inset:0; background:var(--bg); z-index:90;
  display:flex; flex-direction:column;
  transform: translateY(-100%); transition: transform .45s cubic-bezier(.77,0,.18,1);
}
#index-overlay.open{ transform:translateY(0); }
@media (prefers-reduced-motion: reduce){ #index-overlay{ transition:none; } }
.io-top{ display:flex; justify-content:space-between; align-items:center; padding:20px clamp(20px,5vw,48px) 0; }
.io-close{ width:40px; height:40px; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; }
.io-close svg{ width:18px; height:18px; }
.io-list{ flex:1; overflow-y:auto; padding: 10px clamp(20px,5vw,48px) 30px; }
.io-list a{
  display:flex; align-items:baseline; gap:18px; text-decoration:none; padding:14px 0;
  border-top:1px solid var(--line);
  font-family: var(--ff-display); font-weight:600; font-size:clamp(28px,7vw,52px); letter-spacing:-0.01em;
}
.io-list li:last-child a{ border-bottom:1px solid var(--line); }
.io-list a .n{ font-family:var(--ff-mono); font-size:14px; color:var(--muted); font-weight:400; }
.io-list a:hover{ color:var(--accent); }
.io-foot{ padding: 16px clamp(20px,5vw,48px) 26px; display:flex; gap:24px; flex-wrap:wrap; font-family:var(--ff-mono); font-size:11px; letter-spacing:.08em; color:var(--muted); border-top:1px solid var(--line); }
.io-foot a{ text-decoration:none; color:var(--muted); }
.io-foot a:hover{ color:var(--fg); }

/* ============================= WIPE TRANSITION ============================= */
#wipe{ position:fixed; inset:0; background:var(--fg); transform:scaleY(0); transform-origin:top; z-index:80; pointer-events:none; }
#wipe.cover{ animation: wipeCover .68s cubic-bezier(.77,0,.18,1) forwards; }
@keyframes wipeCover{
  0%{ transform:scaleY(0); transform-origin:top; }
  48%{ transform:scaleY(1); transform-origin:top; }
  52%{ transform:scaleY(1); transform-origin:bottom; }
  100%{ transform:scaleY(0); transform-origin:bottom; }
}
@media (prefers-reduced-motion: reduce){ #wipe.cover{ animation:none; } }

/* ============================= INTRO LOADER ============================= */
#intro{
  position:fixed; inset:0; background:var(--bg-inv); color:var(--fg-inv); z-index:100;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  transition: opacity .4s ease, visibility .4s ease;
}
#intro.gone{ opacity:0; visibility:hidden; pointer-events:none; }
.intro-mark{ font-family:var(--ff-display); font-weight:700; font-size:clamp(34px,7vw,64px); letter-spacing:-0.02em; overflow:hidden; }
.intro-mark span{ display:inline-block; transform:translateY(105%); animation: introUp .6s cubic-bezier(.2,.8,.2,1) forwards; }
.intro-mark span:nth-child(2){ animation-delay:.06s; }
@keyframes introUp{ to{ transform:translateY(0); } }
.intro-count{ font-family:var(--ff-mono); font-size:12px; letter-spacing:.25em; opacity:.7; }
.intro-skip{ position:absolute; bottom:22px; right:24px; font-family:var(--ff-mono); font-size:10.5px; letter-spacing:.1em; opacity:.55; }
@media (prefers-reduced-motion: reduce){
  .intro-mark span{ animation:none; transform:none; }
}

/* ============================= TYPE SCALE ============================= */
.eyebrow{ font-family:var(--ff-mono); font-size:11.5px; letter-spacing:.16em; color:var(--muted); text-transform:uppercase; }
.display-xl{ font-family:var(--ff-display); font-weight:700; letter-spacing:-0.02em; line-height:.98; text-wrap:balance; font-size:clamp(44px, 8.4vw, 132px); }
.display-l{ font-family:var(--ff-display); font-weight:700; letter-spacing:-0.015em; line-height:1.02; text-wrap:balance; font-size:clamp(32px, 5.2vw, 72px); }
.display-m{ font-family:var(--ff-display); font-weight:600; letter-spacing:-0.01em; line-height:1.08; text-wrap:balance; font-size:clamp(24px, 3vw, 40px); }
.lede{ font-size:clamp(16px,1.6vw,20px); line-height:1.55; color:var(--fg); max-width:52ch; }
.body-copy{ font-size:15px; line-height:1.7; color:var(--muted); max-width:60ch; }
.num-giant{ font-family:var(--ff-mono); font-variant-numeric:tabular-nums; font-weight:500; font-size:clamp(60px,10vw,160px); line-height:.9; color:var(--line-strong); }

/* reveal-on-scroll lines */
.reveal-line{ overflow:hidden; }
.reveal-line > span{ display:block; transform: translateY(100%); transition: transform .8s cubic-bezier(.2,.8,.2,1); }
.reveal-line.in > span{ transform: translateY(0); }
@media (prefers-reduced-motion: reduce){
  .reveal-line > span{ transition:none; transform:none; }
}
.fade-up{ opacity:0; transform:translateY(18px); transition:opacity .6s ease, transform .6s ease; }
.fade-up.in{ opacity:1; transform:translateY(0); }
@media (prefers-reduced-motion: reduce){ .fade-up{ opacity:1; transform:none; transition:none; } }

/* ============================= SECTIONS / COMMON ============================= */
.section{ padding: clamp(56px,8vw,120px) 0; }
.section-tight{ padding: clamp(36px,5vw,64px) 0; }
.section + .section, .section-tight + .section-tight, .section + .section-tight, .section-tight + .section{ border-top:1px solid var(--line); }
.page-head{ padding: clamp(120px,14vw,180px) 0 clamp(40px,6vw,64px); }
@media (min-width:900px){ .page-head{ padding-top: clamp(90px,10vw,140px); } }

.index-list li{ border-top:1px solid var(--line); }
.index-list li:last-child{ border-bottom:1px solid var(--line); }
.index-row{ display:grid; grid-template-columns: 64px 1fr; gap: clamp(14px,3vw,32px); padding: clamp(20px,3vw,34px) 0; align-items:start; width:100%; text-align:left; }
.index-row .n{ font-family:var(--ff-mono); font-size:13px; color:var(--muted); padding-top:6px; }
.index-row h3{ font-family:var(--ff-display); font-weight:600; font-size:clamp(20px,2.6vw,30px); letter-spacing:-0.01em; }
.index-row .meta{ font-family:var(--ff-mono); font-size:11px; letter-spacing:.08em; color:var(--muted); margin-top:6px; }
button.index-row{ cursor:pointer; }
.index-row .chev{ margin-left:auto; flex-shrink:0; transition: transform .3s ease; }
.index-row[aria-expanded="true"] .chev{ transform:rotate(45deg); }
.index-detail{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .38s ease; }
.index-detail > div{ overflow:hidden; }
.index-row[aria-expanded="true"] + .index-detail{ grid-template-rows:1fr; }
@media (prefers-reduced-motion: reduce){ .index-detail{ transition:none; } }

.tag{ display:inline-flex; align-items:center; gap:6px; font-family:var(--ff-mono); font-size:10.5px; letter-spacing:.08em; color:var(--muted); border:1px solid var(--line); padding:3px 8px; border-radius:2px; }
.btn{
  display:inline-flex; align-items:center; gap:10px; font-family:var(--ff-mono); font-size:12px; letter-spacing:.1em;
  padding: 14px 22px; border:1px solid var(--fg); text-decoration:none; text-transform:uppercase;
}
.btn-solid{ background:var(--fg); color:var(--bg); }
.btn-solid:hover{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
.btn-line:hover{ background:var(--fg); color:var(--bg); }
.btn-accent{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }
.btn svg{ width:14px; height:14px; }

.icon{ width:20px; height:20px; }
.icon-btn{ width:38px; height:38px; border:1px solid var(--line-strong); display:flex; align-items:center; justify-content:center; }

table.spec{ width:100%; border-collapse:collapse; }
table.spec tr{ border-top:1px solid var(--line); }
table.spec tr:last-child{ border-bottom:1px solid var(--line); }
table.spec th,table.spec td{ text-align:left; padding:14px 10px; font-size:13.5px; }
table.spec th{ font-family:var(--ff-mono); font-weight:400; color:var(--muted); width:38%; letter-spacing:.02em; }
table.spec td{ font-family:var(--ff-display); font-weight:500; }

.plate{ aspect-ratio:16/10; border:1px solid var(--line-strong); position:relative; overflow:hidden; background:
  repeating-linear-gradient(115deg, var(--surface-2) 0 2px, transparent 2px 14px);
}
.plate::after{ content:attr(data-code); position:absolute; bottom:12px; right:14px; font-family:var(--ff-mono); font-size:11px; letter-spacing:.1em; color:var(--muted); }
.plate::before{ content:""; position:absolute; inset:0; background: linear-gradient(135deg, transparent 40%, var(--accent) 40%, var(--accent) 41%, transparent 41%); opacity:.5; }

/* marquee */
.marquee{ border-top:1px solid var(--line); border-bottom:1px solid var(--line); overflow:hidden; padding:20px 0; }
.marquee-track{ display:flex; white-space:nowrap; width:max-content; will-change:transform; }
.marquee-track span{ font-family:var(--ff-mono); font-size:clamp(14px,2vw,20px); letter-spacing:.05em; padding:0 26px; color:var(--muted); display:flex; align-items:center; gap:26px; }
.marquee-track span::after{ content:"—"; color:var(--accent); }

/* stat strip */
.stats{ display:grid; grid-template-columns:repeat(2,1fr); border-top:1px solid var(--line-strong); }
@media (min-width:700px){ .stats{ grid-template-columns:repeat(4,1fr); } }
.stat{ padding: 26px clamp(14px,2vw,24px); border-right:1px solid var(--line); border-bottom:1px solid var(--line-strong); }
.stat .v{ font-family:var(--ff-mono); font-weight:500; font-size:clamp(26px,3.4vw,42px); font-variant-numeric:tabular-nums; }
.stat .l{ margin-top:6px; font-family:var(--ff-mono); font-size:10.5px; letter-spacing:.08em; color:var(--muted); }

/* forms */
.field{ display:flex; flex-direction:column; gap:8px; padding: 18px 0; border-top:1px solid var(--line); }
.field label{ font-family:var(--ff-mono); font-size:11px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; }
.field input, .field textarea, .field select{
  border:0; border-bottom:1px solid var(--line-strong); padding:8px 2px; font-size:16px; font-family:var(--ff-display);
  background:transparent; color:var(--fg); width:100%;
}
.field input:focus, .field textarea:focus, .field select:focus{ border-bottom-color:var(--accent); outline:0; }
.field textarea{ resize:vertical; min-height:100px; }
.field-radio{ display:flex; align-items:center; gap:12px; padding:14px 0; border-top:1px solid var(--line); cursor:pointer; }
.field-radio input{ width:16px; height:16px; accent-color:var(--accent); }
.field-radio .fr-title{ font-weight:600; }
.field-radio .fr-price{ margin-left:auto; font-family:var(--ff-mono); font-variant-numeric:tabular-nums; }

/* checklist / pills */
.pill{ display:inline-flex; align-items:center; gap:6px; font-family:var(--ff-mono); font-size:10.5px; letter-spacing:.06em; padding:3px 9px; border-radius:20px; border:1px solid var(--line-strong); }
.pill .dot{ width:6px; height:6px; border-radius:50%; }
.pill.ok .dot{ background:var(--good); } .pill.ok{ color:var(--good); border-color:currentColor; }
.pill.warn .dot{ background:var(--warn); } .pill.warn{ color:var(--warn); border-color:currentColor; }
.pill.bad .dot{ background:var(--bad); } .pill.bad{ color:var(--bad); border-color:currentColor; }
.pill.neutral .dot{ background:var(--muted); } .pill.neutral{ color:var(--muted); }

/* footer */
#site-footer{ padding: clamp(40px,6vw,64px) 0; }
.foot-grid{ display:grid; gap:28px; grid-template-columns:1fr; }
@media (min-width:700px){ .foot-grid{ grid-template-columns:2fr 1fr 1fr 1fr; } }
.foot-grid a{ display:block; text-decoration:none; font-family:var(--ff-mono); font-size:12px; color:var(--muted); padding:4px 0; }
.foot-grid a:hover{ color:var(--fg); }
.foot-grid h4{ font-family:var(--ff-mono); font-size:11px; letter-spacing:.1em; color:var(--muted); margin-bottom:10px; }

::selection{ background:var(--accent); color:var(--accent-fg); }
</style>

<div id="intro" aria-hidden="true">
  <div class="intro-mark"><span>TECHBISS</span></div>
  <div class="intro-count mono" id="intro-count">ASSEMBLING INDEX — 00%</div>
  <div class="intro-skip mono">CLICK / PRESS ANY KEY TO SKIP</div>
</div>

<div id="wipe"></div>

<div id="shell">
  <nav id="rail" aria-label="Primary">
    <div style="display:flex;align-items:center;gap:10px;width:100%;">
      <a href="#/" class="rail-mark" aria-label="TECHBISS — Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h16v4H14v12h-4V8H4z"/></svg>
      </a>
      <span class="rail-wordmark-h">TECHBISS™</span>
    </div>
    <div class="rail-wordmark">TECHBISS — DIGITAL TRANSFORMATION PLATFORM</div>
    <ul class="rail-index" id="rail-index"></ul>
    <div class="rail-bottom">
      <button class="rail-trigger" id="open-index" aria-haspopup="dialog" aria-controls="index-overlay" aria-label="Open section index">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="13" x2="21" y2="13"/><line x1="3" y1="19" x2="13" y2="19"/></svg>
      </button>

        <div class="tt-wipe" id="tt-wipe"></div>

/* ============================= MARQUEE (scroll-scrubbed) ============================= */
function initMarquee(){
  var tracks = document.querySelectorAll('.marquee-track');
  if(!tracks.length) return;
  if(reduce){ return; }
  var raf = null;
  function update(){
    var y = window.scrollY;
    tracks.forEach(function(t){
      var w = t.scrollWidth/2;
      var x = (y*0.6) % w;
      t.style.transform = 'translateX(-'+x+'px)';
    });
    raf = null;
  }
  window.addEventListener('scroll', function(){ if(!raf) raf = requestAnimationFrame(update); }, {passive:true});
  update();
}

/* ============================= WIPE + ROUTER ============================= */
var app = document.getElementById('app');
var wipeEl = document.getElementById('wipe');

var ROUTES = {}; // path pattern -> {render, init}

function matchRoute(path){
  var parts = path.split('/').filter(Boolean);
  for(var key in ROUTES){
    var kp = key.split('/').filter(Boolean);
    if(kp.length !== parts.length) continue;
    var params = {}; var ok = true;
    for(var i=0;i<kp.length;i++){
      if(kp[i].charAt(0)===':'){ params[kp[i].slice(1)] = decodeURIComponent(parts[i]); }
      else if(kp[i] !== parts[i]){ ok=false; break; }
    }
    if(ok) return {route:ROUTES[key], params: params};
  }
  return null;
}

function currentPath(){
  var h = location.hash.replace(/^#/, '');
  if(!h) h = '/';
  return h;
}

function go(doRender){
  if(reduce){ doRender(); window.scrollTo(0,0); return; }
  wipeEl.classList.remove('cover'); void wipeEl.offsetWidth;
  wipeEl.classList.add('cover');
  setTimeout(function(){ doRender(); window.scrollTo(0,0); }, 330);
}

function render(){
  var path = currentPath();
  var m = matchRoute(path);
  go(function(){
    if(!m){ app.innerHTML = render404(); setActiveNav('/'); focusApp(); return; }
    app.innerHTML = m.route.render(m.params);
    setActiveNav(path);
    if(m.route.init) m.route.init(m.params);
    observeReveals(app);
    initMarquee();
    focusApp();
  });
}
function focusApp(){ app.focus({preventScroll:true}); }
window.addEventListener('hashchange', render);

  function recalc(){
    var tier = app.querySelector('input[name="tier"]:checked');
    var tierIdx = tier? parseInt(tier.value,10):0;
    var total = parseInt(tier.dataset.price,10) || 0;
    var lines = ['<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>'+p.tiers[tierIdx].n.toUpperCase()+' TIER</span><span>'+money(total)+'</span></div>'];
    app.querySelectorAll('[data-addon]:checked').forEach(function(cb){
      var idx = parseInt(cb.dataset.addon,10);
      var a = p.addons[idx];
      total += a.p;
      lines.push('<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;color:var(--muted);"><span>+ '+a.n+'</span><span>+$'+a.p.toLocaleString('en-US')+'</span></div>');

    app.querySelector('#summary-total').textContent = tierIdx===2 && !app.querySelectorAll('[data-addon]:checked').length ? 'CUSTOM' : '$'+total.toLocaleString('en-US');

  app.querySelectorAll('input[name="tier"], [data-addon]').forEach(function(inp){ inp.addEventListener('change', recalc); });
  recalc();
}};

  var manifest = app.querySelector('#manifest');
  var pctEl = app.querySelector('#deploy-pct');
  var statusEl = app.querySelector('#deploy-status');
  var lines = [];
  var i = 0;
  function step(){
    if(i >= DEPLOY_STEPS.length){
      pctEl.textContent = '100%'; statusEl.textContent = 'COMPLETE';
      app.querySelector('#deploy-success').classList.remove('hidden');
      app.querySelector('#deploy-id').textContent = 'DEPLOY ID: DEP-'+Math.floor(10000+Math.random()*89999)+' — '+ new Date().toISOString().slice(0,16).replace('T',' ') +' UTC';
      return;
    }
    lines.push('<div>['+String(i+1).padStart(2,'0')+'/0'+DEPLOY_STEPS.length+'] '+DEPLOY_STEPS[i]+' … <span style="color:var(--accent);">RUNNING</span></div>');
    manifest.innerHTML = lines.join('');
    statusEl.textContent = DEPLOY_STEPS[i].toUpperCase();
    var pct = Math.round(((i+1)/DEPLOY_STEPS.length)*100);
    setTimeout(function(){
      lines[lines.length-1] = lines[lines.length-1].replace('RUNNING','<span style=\"color:var(--good);\">DONE</span>').replace('color:var(--accent);','color:var(--good);');
      manifest.innerHTML = lines.join('');
      pctEl.textContent = String(pct).padStart(2,'0')+'%';
      i++;
      setTimeout(step, reduce?60:520);
    }, reduce?40:620);
  }
  setTimeout(step, reduce?40:400);
}};

      '<div class="mono" id="install-log" style="margin-top:18px;font-size:12.5px;line-height:2;color:var(--muted);"></div>';

          return '<li data-v="'+i+'" style="display:flex;gap:12px;align-items:center;color:var(--muted);"><span class="v-box" style="width:16px;height:16px;border:1px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;"></span>'+v+'</li>';
        }).join('')+
      '</ul>';
  }
  function panelLaunch(){
    return '<div style="text-align:center;padding:30px 0;">'+

      '<a class="btn btn-solid" href="#/dashboard" style="margin-top:24px;">OPEN DASHBOARD '+ic('arrow')+'</a>'+
    '</div>';
  }

  var panels = [panelSelect, panelDetect, panelConfigure, panelImport, panelInstall, panelVerify, panelLaunch];
  var stepAnims = [null, animateDetect, null, animateImport, animateInstall, animateVerify, null];

  function animateDetect(){
    var sweep = app.querySelector('#scan-sweep');
    var log = app.querySelector('#scan-log');
    var items = ['Discovered 14 running services','Identified 3 database engines','Mapped 212 API endpoints','Estimated data volume: 2.8 TB'];
    if(reduce){ sweep.style.display='none'; log.innerHTML = items.map(function(t){return '<div>▸ '+t+'</div>';}).join(''); return; }
    var pos=0, dir=1;
    var mv = setInterval(function(){ pos += dir*4; if(pos>70||pos<0){dir*=-1;} sweep.style.left = pos+'%'; }, 60);
    items.forEach(function(t,i){ setTimeout(function(){ log.innerHTML += '<div>▸ '+t+'</div>'; }, 400+i*450); });
    setTimeout(function(){ clearInterval(mv); }, 2200);
  }
  function animateImport(){
    var fill = app.querySelector('#import-fill');
    var pctEl = app.querySelector('#import-pct');

      pctEl.textContent = pct+'% TRANSFERRED';
      if(pct>=100) clearInterval(timer);
    }, reduce?20:150);
  }

    var log = app.querySelector('#install-log');

  function animateVerify(){
    var items = app.querySelectorAll('#verify-list li');

        li.querySelector('.v-box').style.borderColor = 'var(--good)';
      }, reduce?10:i*380+300);
    });
  }

  function renderStep(){
    panel.innerHTML = panels[idx]();
    markIndex();
    if(stepAnims[idx]) setTimeout(stepAnims[idx], 60);
    next.disabled = false;
  }
  next.addEventListener('click', function(){
    if(idx < INSTALL_STEPS.length-1){ idx++; renderStep(); }
    else { next.textContent = 'LAUNCHED'; next.setAttribute('disabled',''); }
  });
  back.addEventListener('click', function(){ if(idx>0){ idx--; renderStep(); } });
  renderStep();
}};

function spark(vals, w, h){
  w = w||100; h = h||28;
  var max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  var range = (max-min)||1;
  var pts = vals.map(function(v,i){
    var x = (i/(vals.length-1))*w;
    var y = h - ((v-min)/range)*h;
    return x+','+y;
  }).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="1.6"/></svg>';
}

              '<p class="mono" style="font-size:10.5px;color:var(--muted);margin-top:4px;">'+a.w+' · '+a.when+'</p>'+
            '</li>';
          }).join('')+
          '<li style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);"></li>'+
        '</ul>'+
        '<p class="eyebrow" style="margin-top:26px;">PLATFORM ALERTS</p>'+
        '<div style="border-top:1px solid var(--line);margin-top:10px;padding:14px 0;display:flex;gap:10px;align-items:flex-start;">'+
          '<span class="pill bad" style="margin-top:2px;"><span class="dot"></span>SLA</span>'+
          '<p style="font-size:13px;">Telecom Infrastructure Operator — BEACON latency SLO breached at 03:12 UTC. Incident INC-2291 opened.</p>'+
        '</div>'+
        '<div style="border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;display:flex;gap:10px;align-items:flex-start;">'+
          '<span class="pill warn" style="margin-top:2px;"><span class="dot"></span>REVIEW</span>'+
          '<p style="font-size:13px;">Quarterly architecture review due for 3 accounts this week.</p>'+
        '</div>'+
      '</div>'+
    '</div>'+
  '</section>'+footer();
}
